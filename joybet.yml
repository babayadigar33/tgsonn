name: Joybet Botu (Saatlik)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  joybet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install websockets requests pillow

      - name: Repodaki dosyaları listele (teşhis)
        run: ls -laR

      - name: Botu çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          BOT=$(find . -maxdepth 4 -name "joybet_bot.py" | head -1)
          if [ -z "$BOT" ]; then
            echo "!!! joybet_bot.py repoda bulunamadı. Code sekmesinden yükleyin. !!!"
            exit 2
          fi
          echo "Bulunan bot dosyası: $BOT"
          python "$BOT"

      - name: Değişiklik takibini kaydet (state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: state güncelle"
            git push
          fi